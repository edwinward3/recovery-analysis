# Purpose: test the real Windows launchers on synthetic, non-confidential data.
# Inputs are generated fixtures; outputs are CI-only reports and no RT data is accessed.
# Analysis is local; setup may download the fixed packages tested here.
name: windows-run

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_500k_scale_gate:
        description: "Run the exact 500,000-row cold Windows release gate"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests and in-memory self-test
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python -m recovery.selftest

      - name: Write XLSX and ZIP inputs with awkward paths
        shell: pwsh
        run: python -m recovery.selftest --write-inputs "ci inputs !" --n-companies 1600

      - name: Run both analysis stages through RUN.bat
        shell: pwsh
        env:
          RECOVERY_NO_PAUSE: "1"
        run: |
          & .\RUN.bat diagnostic "ci inputs !\synthetic judgments.xlsx" "ci inputs !\BasicCompanyDataAsOneFile-2026-06-01.zip" "" "ci outputs !"
          if ($LASTEXITCODE -ne 0) { throw "diagnostic RUN.bat failed with exit code $LASTEXITCODE" }
          & .\RUN.bat locked "ci inputs !\synthetic judgments.xlsx" "ci inputs !\BasicCompanyDataAsOneFile-2026-06-01.zip" 2026-06-01 "ci outputs !"
          if ($LASTEXITCODE -ne 0) { throw "locked RUN.bat failed with exit code $LASTEXITCODE" }

      - name: Assert matching-only Run 1 and model Run 2 outputs
        shell: pwsh
        run: |
          $diagnostic = Get-ChildItem "ci outputs !" -Directory -Filter "diagnostic_*" | Sort-Object Name | Select-Object -Last 1
          $locked = Get-ChildItem "ci outputs !" -Directory -Filter "locked_*" | Sort-Object Name | Select-Object -Last 1
          if (-not $diagnostic -or -not $locked) { throw "both run directories were not produced" }
          $matchingExpected = @(
            "SUMMARY.txt",
            "E1_data_audit.csv", "E1_data_funnel.csv",
            "E2_match_coverage.csv", "E2_unmatched_reasons.csv", "E2_match_methods.csv",
            "E2_match_by_defendant_type.csv", "E2_match_by_judgment_vintage.csv", "E2_incorporation_guards.csv",
            "E5_run_log.csv", "E5_run_manifest.json"
          )
          $modelExpected = @(
            "E3_model_comparison.csv", "E3_calibration.csv", "E3_feature_effects.csv", "E3_split_counts.csv",
            "E4_sensitivities.csv", "E4_lift.csv", "E4_limitations.txt"
          )
          foreach ($run in @($diagnostic, $locked)) {
            $results = Join-Path $run.FullName "results"
            $expected = if ($run.Name -like "locked_*") { $matchingExpected + $modelExpected } else { $matchingExpected }
            foreach ($name in $expected) {
              if (-not (Test-Path (Join-Path $results $name))) { throw "missing $($run.Name) result: $name" }
            }
            $pair = Join-Path $run.FullName "working_files\matching_pairs_1000.csv"
            if (-not (Test-Path $pair)) { throw "$($run.Name) pair-example file missing" }
            $pairs = Import-Csv $pair
            if ($pairs.Count -ne 1000) { throw "$($run.Name) pair file has $($pairs.Count) rows, expected 1000" }
            if (-not ($pairs | Where-Object { $_.source_company_name -match "ALPHA" } | Select-Object -First 1)) { throw "$($run.Name) planted names missing" }
            $env:CI_RESULTS = $results
            python -c "import os; from recovery.disclosure import validate_egress; validate_egress(os.environ['CI_RESULTS'])"
          }
          $diagnosticSummary = Get-Content (Join-Path $diagnostic.FullName "results\SUMMARY.txt") -Raw
          if ($diagnosticSummary -notmatch "RUN 1 MATCHING SUMMARY") { throw "diagnostic matching summary missing" }
          if ($diagnosticSummary -notmatch "No satisfaction model was trained") { throw "diagnostic did not clearly defer modelling" }
          foreach ($name in $modelExpected) {
            if (Test-Path (Join-Path $diagnostic.FullName "results\$name")) { throw "diagnostic unexpectedly wrote model output: $name" }
          }
          if (Test-Path (Join-Path $diagnostic.FullName "working_files\models")) {
            throw "diagnostic unexpectedly retained an internal model folder"
          }
          if (Test-Path (Join-Path $diagnostic.FullName "working_files\model_rows.csv")) {
            throw "diagnostic unexpectedly wrote model split membership"
          }
          foreach ($run in @($diagnostic, $locked)) {
            if (Test-Path (Join-Path $run.FullName "working_files\matching_table.csv.gz")) {
              throw "$($run.Name) retained the full row-level match table"
            }
            if (Test-Path (Join-Path $run.FullName ".aggregate_staging")) {
              throw "$($run.Name) retained aggregate staging files"
            }
          }
          if (Test-Path (Join-Path $locked.FullName "working_files\model_rows.csv")) {
            throw "locked run retained identifiable model split membership"
          }
          $diagnosticManifest = Get-Content (Join-Path $diagnostic.FullName "results\E5_run_manifest.json") -Raw | ConvertFrom-Json
          if ($null -ne $diagnosticManifest.model_only_acceptance) {
            throw "diagnostic unexpectedly retained model acceptance"
          }
          $diagnosticLog = Import-Csv (Join-Path $diagnostic.FullName "results\E5_run_log.csv")
          if ($diagnosticLog.stage | Where-Object { $_ -like "E3*" -or $_ -like "E4*" }) {
            throw "diagnostic unexpectedly executed a model stage"
          }
          $lockedSummary = Get-Content (Join-Path $locked.FullName "results\SUMMARY.txt") -Raw
          if ($lockedSummary -notmatch "Primary judgment-time model") { throw "primary model missing from locked summary" }
          if ($lockedSummary -notmatch "CURRENT-SNAPSHOT FEATURES") { throw "exploratory warning missing from locked summary" }
          $diagnosticPairs = Import-Csv (Join-Path $diagnostic.FullName "working_files\matching_pairs_1000.csv")
          $lockedPairs = Import-Csv (Join-Path $locked.FullName "working_files\matching_pairs_1000.csv")
          if (($diagnosticPairs.ID -join ',') -eq ($lockedPairs.ID -join ',')) { throw "Run 2 pair examples did not change" }
          $truth = Import-Csv "ci inputs !\synthetic_ground_truth.csv"
          if (($truth.corruption_class | Sort-Object -Unique).Count -ne 8) { throw "synthetic corruption classes missing" }

      - name: Prove setup is cached
        shell: pwsh
        env:
          RECOVERY_NO_PAUSE: "1"
          PIP_NO_INDEX: "1"
          PIP_INDEX_URL: "http://127.0.0.1:9/not-used"
        run: |
          $before = (Get-Item ".venv\.setup-key").LastWriteTimeUtc
          & .\RUN.bat --setup-only
          if ($LASTEXITCODE -ne 0) { throw "cached setup failed" }
          $after = (Get-Item ".venv\.setup-key").LastWriteTimeUtc
          if ($before -ne $after) { throw "unchanged lock/version unexpectedly reinstalled the environment" }

  offline-bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the optional wheel folder
        shell: pwsh
        run: |
          $tag = python -c "import sys; print('py'+str(sys.version_info.major)+str(sys.version_info.minor))"
          New-Item -ItemType Directory -Force "wheels\$tag" | Out-Null
          python -m pip download --require-hashes --only-binary=:all: -r requirements.lock -d "wheels\$tag"
      - name: Prove the optional bundle sets up and runs offline
        shell: pwsh
        env:
          RECOVERY_NO_PAUSE: "1"
          PIP_NO_INDEX: "1"
          PIP_INDEX_URL: "http://127.0.0.1:9/not-used"
          HTTPS_PROXY: "http://127.0.0.1:9"
          HTTP_PROXY: "http://127.0.0.1:9"
        run: |
          & .\RUN.bat --setup-only
          if ($LASTEXITCODE -ne 0) { throw "offline setup failed" }
          .\.venv\Scripts\python.exe -m recovery.selftest

  manual-scale:
    if: github.event_name == 'workflow_dispatch' && inputs.run_500k_scale_gate
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare developer test tools
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt
      - name: Generate 500K inputs and enforce both run gates
        shell: pwsh
        env:
          RECOVERY_NO_PAUSE: "1"
        run: |
          python -m recovery.selftest --write-inputs "scale inputs !" --n-companies 500000 --format csv --no-prior-rows
          function ConvertTo-ValidPeak([object]$raw, [string]$source) {
            $text = [string]$raw
            $value = 0.0
            if ([string]::IsNullOrWhiteSpace($text) -or -not [double]::TryParse(
              $text,
              [System.Globalization.NumberStyles]::Float,
              [System.Globalization.CultureInfo]::InvariantCulture,
              [ref]$value
            )) { throw "$source did not report numeric peak memory: $text" }
            if ([double]::IsNaN($value) -or [double]::IsInfinity($value) -or $value -le 0) {
              throw "$source reported unavailable or invalid peak memory: $text"
            }
            return $value
          }
          function Test-ScaleRun([string]$stage) {
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            & .\RUN.bat $stage "scale inputs !\synthetic judgments.csv" "scale inputs !\BasicCompanyDataAsOneFile-2026-06-01.zip" 2026-06-01 "scale outputs !"
            $runExit = $LASTEXITCODE
            $clock.Stop()
            if ($runExit -ne 0) { throw "$stage scale launcher failed" }
            if ($clock.Elapsed.TotalSeconds -gt 7200) { throw "$stage runtime exceeded two hours: $($clock.Elapsed)" }
            $run = Get-ChildItem "scale outputs !" -Directory -Filter "$stage`_*" | Sort-Object Name | Select-Object -Last 1
            if (-not $run) { throw "$stage scale run did not produce an output directory" }
            $env:SCALE_RUN_ROOT = $run.FullName
            python -c "import os; from pathlib import Path; from recovery.selftest import _assert_pair_truth; _assert_pair_truth(Path(os.environ['SCALE_RUN_ROOT']), Path('scale inputs !/synthetic_ground_truth.csv'))"
            $log = Import-Csv (Join-Path $run.FullName "results\E5_run_log.csv")
            $manifest = Get-Content (Join-Path $run.FullName "results\E5_run_manifest.json") -Raw | ConvertFrom-Json
            $peaks = @($log | ForEach-Object {
              ConvertTo-ValidPeak $_.peak_memory_mb "$stage E5 stage '$($_.stage)'"
            })
            $peaks += ConvertTo-ValidPeak $manifest.runtime.peak_memory_mb "$stage E5 manifest"
            $peak = ($peaks | Measure-Object -Maximum).Maximum
            if ($peak -gt 8192) { throw "$stage peak memory exceeded 8 GB: $peak MB" }
            if ($manifest.disclosure.status -ne "pass") { throw "$stage disclosure gate did not pass" }
            $modelReport = Join-Path $run.FullName "results\E3_model_comparison.csv"
            if ($stage -eq "diagnostic" -and (Test-Path $modelReport)) { throw "diagnostic scale run wrote a model report" }
            if ($stage -eq "locked" -and -not (Test-Path $modelReport)) { throw "locked scale run did not write a model report" }
            return [PSCustomObject]@{
              Stage = $stage
              Run = $run
              Manifest = $manifest
              ElapsedSeconds = $clock.Elapsed.TotalSeconds
              PeakMemoryMb = $peak
            }
          }
          $diagnostic = Test-ScaleRun "diagnostic"
          $locked = Test-ScaleRun "locked"
          New-Item -ItemType Directory -Force "scale evidence" | Out-Null
          @(
            "EXACT_WINDOWS_SCALE_GATE=PASS",
            "PYTHON=$(& python -c 'import platform; print(platform.python_version())')",
            "JUDGMENT_ROWS=500000",
            "PLANTED_PAIR_TRUTH=PASS",
            "DIAGNOSTIC_ELAPSED_SECONDS=$($diagnostic.ElapsedSeconds)",
            "DIAGNOSTIC_PEAK_PROCESS_MEMORY_MB=$($diagnostic.PeakMemoryMb)",
            "DIAGNOSTIC_DISCLOSURE_GATE=$($diagnostic.Manifest.disclosure.status)",
            "DIAGNOSTIC_RUN_ID=$($diagnostic.Manifest.run_id)",
            "LOCKED_ELAPSED_SECONDS=$($locked.ElapsedSeconds)",
            "LOCKED_PEAK_PROCESS_MEMORY_MB=$($locked.PeakMemoryMb)",
            "LOCKED_DISCLOSURE_GATE=$($locked.Manifest.disclosure.status)",
            "LOCKED_RUN_ID=$($locked.Manifest.run_id)"
          ) | Set-Content -Encoding utf8 "scale evidence\scale_gate_evidence.txt"
          foreach ($result in @($diagnostic, $locked)) {
            Copy-Item (Join-Path $result.Run.FullName "results\E5_run_log.csv") "scale evidence\$($result.Stage)_E5_run_log.csv"
            Copy-Item (Join-Path $result.Run.FullName "results\E5_run_manifest.json") "scale evidence\$($result.Stage)_E5_run_manifest.json"
            Write-Host "$($result.Stage) scale gate passed: $($result.ElapsedSeconds) seconds; $($result.PeakMemoryMb) MB peak"
          }

      - name: Preserve aggregate scale-gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-500k-windows-scale-evidence
          path: scale evidence
          if-no-files-found: error
          retention-days: 30
